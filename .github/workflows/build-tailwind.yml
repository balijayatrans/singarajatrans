name: Build Tailwind CSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/js/**"
      - "assets/css/tailwind-input.css"
      - "tailwind.config.js"
      - "package.json"
      - ".github/workflows/build-tailwind.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tailwind CSS
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build production CSS
        run: npm run build:css

      - name: Commit generated CSS
        run: |
          if [ -z "$(git status --porcelain -- assets/css/tailwind.css package-lock.json)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/tailwind.css package-lock.json
          git commit -m "Build production Tailwind CSS [skip ci]"
          git push
