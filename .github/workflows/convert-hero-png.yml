name: Convert hero to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-hero-png.yml"
      - "assets/images/hero-ulundanu-user.webp"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert hero image to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("assets/images/hero-ulundanu-user.webp")
          dst = Path("assets/images/hero-ulundanu-user.png")

          image = Image.open(src).convert("RGB")
          image.save(dst, "PNG", optimize=True)
          print(f"Converted {src} -> {dst} ({image.width}x{image.height})")
          PY

      - name: Update hero references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("assets/images/hero-ulundanu-user.webp", "assets/images/hero-ulundanu-user.png")
          text = text.replace("home-top.css?v=20261010-user-photo-1", "home-top.css?v=20261010-user-photo-png-1")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit PNG hero
        run: |
          git config user.name "Bali Jaya Trans"
          git config user.email "balijayatrans@gmail.com"
          git add assets/images/hero-ulundanu-user.png index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Use PNG hero image"
            git push
          fi
